<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="logoPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#logoBgGrad)"/>
  <circle cx="1040" cy="360" r="350" fill="url(#logoGlow)"/>
  <circle cx="220" cy="120" r="240" fill="#a855f7" fill-opacity="0.04"/>

  <!-- Subtle Studio Grid -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="1000" y1="0" x2="1000" y2="720"/>
  </g>

  <!-- LEFT COLUMN: Typography & Badges -->
  <g transform="translate(80, 110)">
    <!-- LIVE Badge -->
    <g>
      <rect x="0" y="0" width="240" height="48" rx="24" fill="url(#logoPill)" filter="url(#logoShadow)"/>
      <circle cx="28" cy="24" r="8" fill="#ef4444" filter="url(#redGlow)"/>
      <circle cx="28" cy="24" r="4" fill="#ffffff"/>
      <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1.5">LIVE ONLINE COURSE</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#0f172a" letter-spacing="-1.5">LOGO &amp;</text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#7c3aed" letter-spacing="-1.5">BRANDING DESIGN</text>

    <!-- Subtitle / Key Areas -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#475569">
      Brand Guidelines • Golden Ratio • Vector Systems
    </text>
    <text x="0" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#64748b">
      Typography Pairing • Packaging Mockups • High-Ticket Identity
    </text>

    <!-- Stat Pill Tags -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="200" height="42" rx="12" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#a21caf">💎 Luxury Brand Systems</text>

      <rect x="215" y="0" width="210" height="42" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
      <text x="233" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6d28d9">📐 Golden Ratio Geometry</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Brand Identity Studio Workstation Art -->
  <g transform="translate(730, 90)">
    <!-- Brand Guidelines Book / Canvas -->
    <rect x="20" y="50" width="440" height="340" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#logoShadow)"/>
    
    <!-- Top Studio Bar -->
    <path d="M 20 74 Q 20 50 44 50 L 436 50 Q 460 50 460 74 L 460 95 L 20 95 Z" fill="#18181b"/>
    <circle cx="48" cy="72" r="5" fill="#ef4444"/>
    <circle cx="64" cy="72" r="5" fill="#f59e0b"/>
    <circle cx="80" cy="72" r="5" fill="#10b981"/>
    <text x="105" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a1a1aa" letter-spacing="1">BRAND GUIDELINES &amp; IDENTITY SPECIMEN</text>

    <!-- Visual Identity Grid Inside -->
    <g transform="translate(50, 120)">
      <!-- Golden Ratio Spiral & Circles -->
      <g stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.6">
        <rect x="0" y="10" width="130" height="130" rx="8"/>
        <circle cx="65" cy="75" r="65"/>
        <circle cx="65" cy="75" r="40"/>
        <circle cx="65" cy="75" r="24"/>
      </g>

      <!-- 3D Geometric Polygonal Logo Gem -->
      <g transform="translate(170, 20)">
        <polygon points="90,10 160,50 160,130 90,170 20,130 20,50" fill="url(#gemGrad)" filter="url(#logoShadow)"/>
        <polygon points="90,10 160,50 90,95 20,50" fill="#ffffff" fill-opacity="0.3"/>
        <polygon points="90,95 160,50 160,130 90,170" fill="#000000" fill-opacity="0.2"/>
        <polygon points="90,95 20,50 20,130 90,170" fill="#ffffff" fill-opacity="0.15"/>
      </g>

      <!-- Color Swatches Palette -->
      <g transform="translate(0, 180)">
        <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#71717a" text-transform="uppercase" letter-spacing="1">Brand Color Swatches</text>
        <rect x="0" y="28" width="55" height="36" rx="8" fill="#4f46e5"/>
        <rect x="65" y="28" width="55" height="36" rx="8" fill="#7c3aed"/>
        <rect x="130" y="28" width="55" height="36" rx="8" fill="#ec4899"/>
        <rect x="195" y="28" width="55" height="36" rx="8" fill="#f59e0b"/>
        <rect x="260" y="28" width="55" height="36" rx="8" fill="#0f172a"/>
      </g>
    </g>

    <!-- 3D Floating Elements -->
    <!-- 1. Floating Pen Nib / Quill Badge -->
    <g transform="translate(-20, 25)" filter="url(#logoShadow)">
      <rect width="105" height="105" rx="26" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
      <circle cx="52" cy="52" r="38" fill="#faf5ff"/>
      <text x="30" y="65" font-size="42">✒️</text>
    </g>

    <!-- 2. Floating Color Palette Badge -->
    <g transform="translate(370, 250)" filter="url(#logoShadow)">
      <rect width="105" height="105" rx="26" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
      <circle cx="52" cy="52" r="38" fill="#fdf2f8"/>
      <text x="28" y="65" font-size="42">🎨</text>
    </g>

    <!-- 3. Floating Diamond / Gem Badge -->
    <g transform="translate(20, 340)" filter="url(#logoShadow)">
      <rect width="95" height="95" rx="24" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
      <circle cx="47" cy="47" r="35" fill="#f5f3ff"/>
      <text x="25" y="60" font-size="38">💎</text>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(80, 650)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1.2">
      DIGITAL HUNARMAND HUB • PROFESSIONAL ACADEMY 2026
    </text>
  </g>
</svg>
